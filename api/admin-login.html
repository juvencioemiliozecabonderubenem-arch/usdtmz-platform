<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDTMZ — Login Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      margin: 20px;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      min-height: 20px;
      color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>USDTMZ</h1>
    <div class="subtitle">Painel Administrativo</div>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Entrar
      </button>

      <div id="message"></div>

    </form>
  </div>

<script>
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  message.textContent = "";
  button.disabled = true;
  button.textContent = "Entrando...";

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const response = await fetch("/api/admin-login", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      message.textContent = data.message || "Não foi possível entrar.";
      return;
    }

    window.location.href = "/admin.html";

  } catch (error) {
    message.textContent = "Erro de conexão com o servidor.";
  } finally {
    button.disabled = false;
    button.textContent = "Entrar";
  }
});
</script>

</body>
</html>
