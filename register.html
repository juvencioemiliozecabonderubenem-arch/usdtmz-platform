<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Criar conta - USDTMZ</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>USDTMZ</h1>

  <div class="subtitle">
    Criar nova conta
  </div>

  <form id="registerForm">

    <label for="name">
      Nome completo
    </label>

    <input
      id="name"
      type="text"
      placeholder="Digite seu nome"
      required
    >

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Digite seu email"
      required
    >

    <label for="phone">
      Telefone
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="Ex: 84xxxxxxx"
    >

    <label for="password">
      Senha
    </label>

    <input
      id="password"
      type="password"
      placeholder="Mínimo 8 caracteres"
      minlength="8"
      required
    >

    <label for="confirmPassword">
      Confirmar senha
    </label>

    <input
      id="confirmPassword"
      type="password"
      placeholder="Digite a senha novamente"
      minlength="8"
      required
    >

    <button id="submitButton" type="submit">
      Criar conta
    </button>

  </form>

  <div id="message" class="message"></div>

</div>

<script>

  const form =
    document.getElementById("registerForm");

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("submitButton");


  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "";
    message.className = "message";

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

      message.textContent =
        "As senhas não coincidem.";

      message.classList.add("error");

      return;
    }


    if (password.length < 8) {

      message.textContent =
        "A senha deve ter pelo menos 8 caracteres.";

      message.classList.add("error");

      return;
    }


    button.disabled = true;

    button.textContent =
      "Criando conta...";


    try {

      const response = await fetch(
        "/api/register-user",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            name,
            email,
            phone,
            password
          })
        }
      );


      const data =
        await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "Não foi possível criar a conta."
        );
      }


      message.textContent =
        "✓ Conta criada com sucesso!";

      message.classList.add("success");


      form.reset();


    } catch (error) {

      message.textContent =
        error.message;

      message.classList.add("error");

    } finally {

      button.disabled = false;

      button.textContent =
        "Criar conta";
    }

  });

</script>

</body>
</html>
