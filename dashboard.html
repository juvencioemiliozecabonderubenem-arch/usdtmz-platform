<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - USDTMZ</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      background: #dc2626;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .welcome p {
      margin: 0;
      color: #6b7280;
    }

    .balance-card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .balance-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .balance {
      font-size: 34px;
      font-weight: bold;
    }

    .currency {
      font-size: 18px;
      color: #16a34a;
      margin-left: 5px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .action {
      background: white;
      border: none;
      border-radius: 12px;
      padding: 22px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .action:hover {
      transform: translateY(-2px);
    }

    .action h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .action p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .buy {
      border-left: 5px solid #16a34a;
    }

    .withdraw {
      border-left: 5px solid #2563eb;
    }

    .history {
      margin-top: 20px;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .history h2 {
      margin-top: 0;
    }

    .empty {
      color: #6b7280;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #6b7280;
    }

    @media (max-width: 600px) {

      .actions {
        grid-template-columns: 1fr;
      }

      .balance {
        font-size: 28px;
      }

      header {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    USDTMZ
  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Sair
  </button>

</header>


<main id="mainContent">

  <div class="loading">
    A carregar a sua conta...
  </div>

</main>


<script>

  const mainContent =
    document.getElementById(
      "mainContent"
    );


  function formatUsdtBalance(value) {

    const number = Number(value || 0);

    if (!Number.isFinite(number)) {
      return "0";
    }

    if (number === 0) {
      return "0";
    }

    return number
      .toFixed(8)
      .replace(/\.?0+$/, "");
  }


  async function loadDashboard() {

    try {

      const response =
        await fetch(
          "/api/user-session",
          {
            method: "GET",
            credentials: "include"
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success ||
        !data.authenticated
      ) {

        window.location.href =
          "/login.html";

        return;
      }


      const user =
        data.user;


      mainContent.innerHTML = `

        <div class="welcome">

          <h1>
            Olá, ${escapeHtml(user.name)} 👋
          </h1>

          <p>
            Bem-vindo à sua conta USDTMZ.
          </p>

        </div>


        <div class="balance-card">

          <div class="balance-title">
            Saldo disponível
          </div>

          <div class="balance">

            <span>
              ${formatUsdtBalance(
                user.usdt_balance
              )}
            </span>

            <span class="currency">
              USDT
            </span>

          </div>

        </div>


        <div class="actions">

          <button
            class="action buy"
            onclick="buyUsdt()"
          >

            <h2>
              Comprar USDT
            </h2>

            <p>
              Comprar USDT usando M-Pesa,
              e-Mola ou outro método disponível.
            </p>

          </button>


          <button
            class="action withdraw"
            onclick="withdrawUsdt()"
          >

            <h2>
              Retirar USDT
            </h2>

            <p>
              Enviar USDT para uma carteira
              TRON (TRC-20).
            </p>

          </button>

        </div>


        <div class="history">

          <h2>
            Histórico
          </h2>

          <div class="empty">
            Ainda não existem transações.
          </div>

        </div>

      `;

    } catch (error) {

      console.error(
        "Erro ao carregar dashboard:",
        error
      );

      window.location.href =
        "/login.html";

    }

  }


  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function buyUsdt() {

    alert(
      "A área de compra de USDT será criada no próximo passo."
    );

  }


  function withdrawUsdt() {

    alert(
      "A área de retirada de USDT será criada no próximo passo."
    );

  }


  function logout() {

    alert(
      "Logout será configurado no próximo passo."
    );

  }


  loadDashboard();

</script>

</body>
</html>
