<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDTMZ - Login Admin">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      margin: 20px;
      padding: 30px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      min-height: 20px;
      text-align: center;
      color: #dc2626;
      font-size: 14px;
    }

    .success {
      color: #16a34a !important;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>USDTMZ</h1>

    <div class="subtitle">
      Painel Administrativo
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        autocomplete="username"
        required
      >

      <label for="password">Senha</label>

      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Entrar
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>
    "use strict";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, success) {
      message.textContent = text || "";
      message.className = success ? "success" : "";
    }

    async function loginAdmin(email, password) {
      const response = await fetch("/api/admin-login", {
        method: "POST",
        credentials: "include",
        cache: "no-store",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          email: email,
          password: password
        })
      });

      let data = {};

      try {
        data = await response.json();
      } catch {
        data = {};
      }

      if (!response.ok || data.success !== true) {
        const error = new Error(
          data.message || "Falha no login."
        );

        error.status = response.status;
        error.data = data;

        throw error;
      }

      return data;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      showMessage("", false);

      button.disabled = true;
      button.textContent = "Entrando...";

      const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const password = document
        .getElementById("password")
        .value;

      if (!email || !password) {
        showMessage(
          "Email e senha são obrigatórios.",
          false
        );

        button.disabled = false;
        button.textContent = "Entrar";
        return;
      }

      try {
        const data = await loginAdmin(
          email,
          password
        );

        showMessage(
          data.message || "Login realizado com sucesso.",
          true
        );

        setTimeout(function() {
          window.location.replace("/admin.html");
        }, 100);

      } catch (error) {
        console.error(
          "USDTMZ Login Admin:",
          error
        );

        if (error.status === 401) {
          showMessage(
            error.data?.message ||
            "Email ou senha incorretos.",
            false
          );

        } else if (error.status === 400) {
          showMessage(
            error.data?.message ||
            "Dados de login inválidos.",
            false
          );

        } else if (error.status >= 500) {
          showMessage(
            "Erro interno do servidor.",
            false
          );

        } else {
          showMessage(
            error.data?.message ||
            "Erro de conexão com o servidor.",
            false
          );
        }

      } finally {
        button.disabled = false;
        button.textContent = "Entrar";
      }
    });
  </script>

</body>
</html>
