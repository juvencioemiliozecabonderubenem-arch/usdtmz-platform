<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>USDTMZ Admin — Levantamentos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .topbar {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      font-size: 24px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .refresh {
      background: #e5e7eb;
      color: #111827;
    }

    .refresh:hover {
      background: #d1d5db;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .stat-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 700;
    }

    .table-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    th,
    td {
      padding: 13px 12px;
      border-bottom: 1px solid #edf0f4;
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
    }

    th {
      background: #f9fafb;
      color: #4b5563;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .amount {
      font-weight: 700;
      white-space: nowrap;
    }

    .address {
      max-width: 190px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
    }

    .tx {
      max-width: 180px;
      word-break: break-all;
      font-family: monospace;
      font-size: 11px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .status-authorized {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status-processing {
      background: #fefce8;
      color: #a16207;
    }

    .status-completed {
      background: #ecfdf5;
      color: #047857;
    }

    .status-rejected {
      background: #fef2f2;
      color: #b91c1c;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .btn-authorize {
      background: #2563eb;
      color: white;
    }

    .btn-authorize:hover {
      background: #1d4ed8;
    }

    .btn-reject {
      background: #dc2626;
      color: white;
    }

    .btn-reject:hover {
      background: #b91c1c;
    }

    .btn-process {
      background: #059669;
      color: white;
    }

    .btn-process:hover {
      background: #047857;
    }

    .btn-disabled {
      background: #e5e7eb;
      color: #6b7280;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px 15px;
      border-radius: 9px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .message.info {
      display: block;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: #6b7280;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }

    .small {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 18px 10px 40px;
      }

      .topbar {
        padding: 14px;
      }

      .topbar h1 {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <a class="back" href="/admin.html">← Voltar</a>
    <h1>USDTMZ Admin</h1>
  </div>

  <main class="container">

    <div class="header-row">
      <h2>Pedidos de Levantamento</h2>

      <button
        class="refresh"
        id="refreshBtn"
        onclick="loadWithdrawals()"
      >
        🔄 Atualizar
      </button>
    </div>

    <div id="message" class="message"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Pendentes</div>
        <div class="stat-value" id="pendingCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Autorizados</div>
        <div class="stat-value" id="authorizedCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Processando</div>
        <div class="stat-value" id="processingCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Concluídos</div>
        <div class="stat-value" id="completedCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Rejeitados</div>
        <div class="stat-value" id="rejectedCount">0</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-wrap">

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Utilizador</th>
              <th>Valor</th>
              <th>Endereço TRON</th>
              <th>Rede</th>
              <th>Data</th>
              <th>Status</th>
              <th>TX Hash</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="withdrawalsBody">
            <tr>
              <td colspan="9">
                <div class="loading">
                  Carregando levantamentos...
                </div>
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>

  </main>

<script>
  let withdrawals = [];

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showMessage(text, type = "info") {
    const box =
      document.getElementById("message");

    box.className =
      "message " + type;

    box.textContent = text;
  }

  function hideMessage() {
    const box =
      document.getElementById("message");

    box.className = "message";
    box.textContent = "";
  }

  function normalizeStatus(status) {
    return String(status || "")
      .trim()
      .toUpperCase();
  }

  function statusLabel(status) {
    const value =
      normalizeStatus(status);

    switch (value) {
      case "PENDING":
        return "Pendente";

      case "AUTHORIZED":
        return "Autorizado";

      case "PROCESSING":
        return "Processando";

      case "COMPLETED":
        return "Concluído";

      case "REJECTED":
        return "Rejeitado";

      default:
        return status || "-";
    }
  }

  function statusClass(status) {
    const value =
      normalizeStatus(status);

    switch (value) {
      case "PENDING":
        return "status-pending";

      case "AUTHORIZED":
        return "status-authorized";

      case "PROCESSING":
        return "status-processing";

      case "COMPLETED":
        return "status-completed";

      case "REJECTED":
        return "status-rejected";

      default:
        return "";
    }
  }

  function formatDate(value) {
    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleString(
      "pt-PT",
      {
        dateStyle: "short",
        timeStyle: "medium"
      }
    );
  }

  function formatAmount(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "0.000000";
    }

    const number =
      Number(value);

    if (!Number.isFinite(number)) {
      return String(value);
    }

    return number.toFixed(6);
  }

  function shortHash(hash) {
    if (!hash) {
      return "-";
    }

    const text =
      String(hash);

    if (text.length <= 18) {
      return text;
    }

    return (
      text.slice(0, 10) +
      "..." +
      text.slice(-8)
    );
  }

  function updateCounters() {
    const counts = {
      PENDING: 0,
      AUTHORIZED: 0,
      PROCESSING: 0,
      COMPLETED: 0,
      REJECTED: 0
    };

    withdrawals.forEach(item => {
      const status =
        normalizeStatus(item.status);

      if (
        Object.prototype.hasOwnProperty.call(
          counts,
          status
        )
      ) {
        counts[status]++;
      }
    });

    document.getElementById(
      "pendingCount"
    ).textContent = counts.PENDING;

    document.getElementById(
      "authorizedCount"
    ).textContent = counts.AUTHORIZED;

    document.getElementById(
      "processingCount"
    ).textContent = counts.PROCESSING;

    document.getElementById(
      "completedCount"
    ).textContent = counts.COMPLETED;

    document.getElementById(
      "rejectedCount"
    ).textContent = counts.REJECTED;
  }

  function renderWithdrawals() {
    const body =
      document.getElementById(
        "withdrawalsBody"
      );

    if (!withdrawals.length) {
      body.innerHTML = `
        <tr>
          <td colspan="9">
            <div class="empty">
              Nenhum levantamento encontrado.
            </div>
          </td>
        </tr>
      `;

      updateCounters();
      return;
    }

    body.innerHTML =
      withdrawals.map(item => {

        const status =
          normalizeStatus(item.status);

        let actions = "";

        if (status === "PENDING") {
          actions = `
            <div class="actions">

              <button
                class="btn-authorize"
                onclick="authorizeWithdrawal('${escapeHtml(item.withdrawal_id)}')"
              >
                Autorizar
              </button>

              <button
                class="btn-reject"
                onclick="rejectWithdrawal('${escapeHtml(item.withdrawal_id)}')"
              >
                Rejeitar
              </button>

            </div>
          `;
        }

        else if (status === "AUTHORIZED") {
          actions = `
            <div class="actions">

              <button
                class="btn-process"
                onclick="processWithdrawal('${escapeHtml(item.withdrawal_id)}')"
              >
                📤 Processar envio
              </button>

            </div>
          `;
        }

        else if (status === "PROCESSING") {

          if (item.tx_hash) {
            actions = `
              <div class="actions">

                <button
                  class="btn-disabled"
                  disabled
                >
                  ⏳ Aguardando confirmação
                </button>

              </div>
            `;
          } else {
            actions = `
              <div class="actions">

                <button
                  class="btn-disabled"
                  disabled
                >
                  Processamento em andamento
                </button>

              </div>
            `;
          }
        }

        else if (status === "COMPLETED") {
          actions = `
            <span class="small">
              Transação concluída
            </span>
          `;
        }

        else if (status === "REJECTED") {
          actions = `
            <span class="small">
              Levantamento rejeitado
            </span>
          `;
        }

        return `
          <tr>

            <td>
              <strong>
                ${escapeHtml(item.withdrawal_id || "-")}
              </strong>
            </td>

            <td>
              ${escapeHtml(item.user_id || "-")}
            </td>

            <td class="amount">
              ${formatAmount(
                item.amount_to_send ??
                item.amount ??
                item.amount_requested
              )}
              USDT
            </td>

            <td class="address">
              ${escapeHtml(
                item.destination_address || "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                item.network || "TRON"
              )}
            </td>

            <td>
              ${escapeHtml(
                formatDate(item.created_at)
              )}
            </td>

            <td>
              <span class="status ${statusClass(status)}">
                ${escapeHtml(
                  statusLabel(status)
                )}
              </span>
            </td>

            <td class="tx" title="${escapeHtml(item.tx_hash || "")}">
              ${
                item.tx_hash
                  ? escapeHtml(
                      shortHash(item.tx_hash)
                    )
                  : "-"
              }
            </td>

            <td>
              ${actions}
            </td>

          </tr>
        `;
      }).join("");

    updateCounters();
  }

  async function loadWithdrawals() {
    hideMessage();

    const refreshBtn =
      document.getElementById(
        "refreshBtn"
      );

    refreshBtn.disabled = true;
    refreshBtn.textContent =
      "🔄 Atualizando...";

    try {
      const response =
        await fetch(
          "/api/admin-withdrawals",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store"
          }
        );

      const data =
        await response.json();

      if (
        response.status === 401 ||
        data.authenticated === false
      ) {
        window.location.href =
          "/admin-login.html";

        return;
      }

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Não foi possível carregar os levantamentos."
        );
      }

      withdrawals =
        Array.isArray(data.withdrawals)
          ? data.withdrawals
          : Array.isArray(data.data)
            ? data.data
            : [];

      renderWithdrawals();

    } catch (error) {
      console.error(error);

      showMessage(
        error.message ||
        "Erro ao carregar levantamentos.",
        "error"
      );

    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent =
        "🔄 Atualizar";
    }
  }

  async function authorizeWithdrawal(
    withdrawalId
  ) {
    const confirmed =
      confirm(
        "Tem certeza que deseja autorizar este levantamento?"
      );

    if (!confirmed) {
      return;
    }

    try {
      showMessage(
        "Autorizando levantamento...",
        "info"
      );

      const response =
        await fetch(
          "/api/admin-withdrawal-action",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              withdrawal_id:
                withdrawalId,
              action:
                "AUTHORIZE"
            })
          }
        );

      const data =
        await response.json();

      if (
        response.status === 401 ||
        data.authenticated === false
      ) {
        window.location.href =
          "/admin-login.html";

        return;
      }

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Não foi possível autorizar."
        );
      }

      showMessage(
        "Levantamento autorizado com sucesso.",
        "success"
      );

      await loadWithdrawals();

    } catch (error) {
      console.error(error);

      showMessage(
        error.message ||
        "Erro ao autorizar levantamento.",
        "error"
      );
    }
  }

  async function rejectWithdrawal(
    withdrawalId
  ) {
    const reason =
      prompt(
        "Digite o motivo da rejeição:"
      );

    if (reason === null) {
      return;
    }

    const trimmed =
      reason.trim();

    if (!trimmed) {
      showMessage(
        "O motivo da rejeição é obrigatório.",
        "error"
      );

      return;
    }

    try {
      showMessage(
        "Rejeitando levantamento...",
        "info"
      );

      const response =
        await fetch(
          "/api/admin-withdrawal-action",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              withdrawal_id:
                withdrawalId,
              action:
                "REJECT",
              rejection_reason:
                trimmed
            })
          }
        );

      const data =
        await response.json();

      if (
        response.status === 401 ||
        data.authenticated === false
      ) {
        window.location.href =
          "/admin-login.html";

        return;
      }

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Não foi possível rejeitar."
        );
      }

      showMessage(
        "Levantamento rejeitado.",
        "success"
      );

      await loadWithdrawals();

    } catch (error) {
      console.error(error);

      showMessage(
        error.message ||
        "Erro ao rejeitar levantamento.",
        "error"
      );
    }
  }

  async function processWithdrawal(
    withdrawalId
  ) {
    const withdrawal =
      withdrawals.find(
        item =>
          String(item.withdrawal_id) ===
          String(withdrawalId)
      );

    if (!withdrawal) {
      showMessage(
        "Levantamento não encontrado.",
        "error"
      );

      return;
    }

    if (
      normalizeStatus(
        withdrawal.status
      ) !== "AUTHORIZED"
    ) {
      showMessage(
        "Este levantamento não está autorizado para processamento.",
        "error"
      );

      return;
    }

    const amount =
      withdrawal.amount_to_send ??
      withdrawal.amount ??
      withdrawal.amount_requested;

    const destination =
      withdrawal.destination_address ||
      "";

    const confirmed =
      confirm(
        "CONFIRMAÇÃO DE ENVIO\n\n" +
        "Valor: " +
        formatAmount(amount) +
        " USDT\n\n" +
        "Destino TRON:\n" +
        destination +
        "\n\n" +
        "A operação enviará USDT pela rede TRON.\n\n" +
        "Deseja continuar?"
      );

    if (!confirmed) {
      return;
    }

    try {
      showMessage(
        "Processando envio de USDT. Aguarde...",
        "info"
      );

      const response =
        await fetch(
          "/api/admin-withdrawal-process",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              withdrawal_id:
                withdrawalId
            })
          }
        );

      const data =
        await response.json();

      if (
        response.status === 401 ||
        data.authenticated === false
      ) {
        window.location.href =
          "/admin-login.html";

        return;
      }

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Não foi possível processar o envio."
        );
      }

      if (data.tx_hash) {
        showMessage(
          "USDT enviado. TX Hash registrado: " +
          data.tx_hash,
          "success"
        );
      } else {
        showMessage(
          data.message ||
          "Processamento iniciado.",
          "success"
        );
      }

      await loadWithdrawals();

    } catch (error) {
      console.error(error);

      showMessage(
        error.message ||
        "Erro ao processar envio.",
        "error"
      );

      await loadWithdrawals();
    }
  }

  /*
   * Verificação da sessão antes de carregar a página.
   */
  async function checkAdminSession() {
    try {
      const response =
        await fetch(
          "/api/admin-session",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store"
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        data.authenticated !== true
      ) {
        window.location.href =
          "/admin-login.html";

        return false;
      }

      return true;

    } catch (error) {
      console.error(error);

      window.location.href =
        "/admin-login.html";

      return false;
    }
  }

  /*
   * Inicialização.
   */
  (async function init() {
    const authenticated =
      await checkAdminSession();

    if (!authenticated) {
      return;
    }

    await loadWithdrawals();
  })();
</script>

</body>
</html>
