<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDTMZ - Levantamentos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .back-button {
      background: #374151;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 1400px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top h2 {
      margin: 0;
    }

    .refresh-button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card span {
      display: block;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card strong {
      font-size: 26px;
    }

    .table-container {
      background: white;
      border-radius: 12px;
      padding: 15px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .pendente {
      background: #fef3c7;
      color: #92400e;
    }

    .autorizado {
      background: #dbeafe;
      color: #1e40af;
    }

    .processando {
      background: #e0e7ff;
      color: #3730a3;
    }

    .concluido {
      background: #dcfce7;
      color: #166534;
    }

    .rejeitado,
    .falhou {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-button {
      border: none;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .authorize {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .process {
      background: #2563eb;
      color: white;
    }

    .complete {
      background: #059669;
      color: white;
    }

    .no-action {
      color: #6b7280;
      font-size: 12px;
    }

    .message {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }

    .address {
      max-width: 220px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
    }

    .hash {
      max-width: 180px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>

  <h1>USDTMZ Admin — Levantamentos</h1>

  <button
    class="back-button"
    onclick="window.location.href='/admin.html'"
  >
    ← Voltar
  </button>

</header>

<div class="container">

  <div class="top">

    <h2>Pedidos de Levantamento</h2>

    <button
      class="refresh-button"
      onclick="carregarLevantamentos()"
    >
      🔄 Atualizar
    </button>

  </div>

  <div class="cards">

    <div class="card">
      <span>Pendentes</span>
      <strong id="pendentes">0</strong>
    </div>

    <div class="card">
      <span>Autorizados</span>
      <strong id="autorizados">0</strong>
    </div>

    <div class="card">
      <span>Processando</span>
      <strong id="processando">0</strong>
    </div>

    <div class="card">
      <span>Concluídos</span>
      <strong id="concluidos">0</strong>
    </div>

    <div class="card">
      <span>Rejeitados</span>
      <strong id="rejeitados">0</strong>
    </div>

  </div>

  <div class="table-container">

    <table>

      <thead>

        <tr>
          <th>ID</th>
          <th>Utilizador</th>
          <th>Valor</th>
          <th>Endereço TRON</th>
          <th>Rede</th>
          <th>Data</th>
          <th>Status</th>
          <th>TX Hash</th>
          <th>Ações</th>
        </tr>

      </thead>

      <tbody id="withdrawalsBody">

        <tr>
          <td colspan="9" class="message">
            A carregar...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

<script>

async function verificarSessao() {

  try {

    const response = await fetch(
      "/api/admin-session",
      {
        method: "GET",
        credentials: "include",
        cache: "no-store"
      }
    );

    if (!response.ok) {

      window.location.href =
        "/admin-login.html";

      return false;
    }

    return true;

  } catch {

    window.location.href =
      "/admin-login.html";

    return false;
  }
}


function normalizarStatus(status) {

  return String(status || "")
    .trim()
    .toUpperCase();

}


function statusTexto(status) {

  const s = normalizarStatus(status);

  if (
    s === "PENDING" ||
    s === "PENDENTE"
  ) {
    return "Pendente";
  }

  if (
    s === "AUTHORIZED" ||
    s === "AUTORIZADO"
  ) {
    return "Autorizado";
  }

  if (
    s === "PROCESSING" ||
    s === "PROCESSANDO"
  ) {
    return "Processando";
  }

  if (
    s === "COMPLETED" ||
    s === "CONCLUIDO"
  ) {
    return "Concluído";
  }

  if (
    s === "REJECTED" ||
    s === "REJEITADO"
  ) {
    return "Rejeitado";
  }

  if (
    s === "FAILED" ||
    s === "FALHOU"
  ) {
    return "Falhou";
  }

  return status || "-";
}


function statusClasse(status) {

  const s = normalizarStatus(status);

  if (
    s === "PENDING" ||
    s === "PENDENTE"
  ) {
    return "pendente";
  }

  if (
    s === "AUTHORIZED" ||
    s === "AUTORIZADO"
  ) {
    return "autorizado";
  }

  if (
    s === "PROCESSING" ||
    s === "PROCESSANDO"
  ) {
    return "processando";
  }

  if (
    s === "COMPLETED" ||
    s === "CONCLUIDO"
  ) {
    return "concluido";
  }

  if (
    s === "REJECTED" ||
    s === "REJEITADO"
  ) {
    return "rejeitado";
  }

  if (
    s === "FAILED" ||
    s === "FALHOU"
  ) {
    return "falhou";
  }

  return "";
}


function formatarData(data) {

  if (!data) {
    return "-";
  }

  try {

    return new Date(data).toLocaleString(
      "pt-PT"
    );

  } catch {

    return data;

  }
}


function escaparHTML(valor) {

  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


async function carregarLevantamentos() {

  const body =
    document.getElementById(
      "withdrawalsBody"
    );

  body.innerHTML = `
    <tr>
      <td colspan="9" class="message">
        A carregar...
      </td>
    </tr>
  `;

  try {

    const response = await fetch(
      "/api/admin-withdrawals",
      {
        method: "GET",
        credentials: "include",
        cache: "no-store"
      }
    );

    if (response.status === 401) {

      window.location.href =
        "/admin-login.html";

      return;
    }

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "Erro ao carregar levantamentos."
      );

    }

    const withdrawals =
      Array.isArray(data.withdrawals)
        ? data.withdrawals
        : [];

    atualizarContadores(withdrawals);

    if (withdrawals.length === 0) {

      body.innerHTML = `
        <tr>
          <td colspan="9" class="message">
            Nenhum levantamento encontrado.
          </td>
        </tr>
      `;

      return;
    }

    body.innerHTML =
      withdrawals
        .map(criarLinha)
        .join("");

  } catch (error) {

    console.error(error);

    body.innerHTML = `
      <tr>
        <td colspan="9" class="message">
          Erro ao carregar levantamentos.
        </td>
      </tr>
    `;
  }

}


function atualizarContadores(withdrawals) {

  let pendentes = 0;
  let autorizados = 0;
  let processando = 0;
  let concluidos = 0;
  let rejeitados = 0;

  withdrawals.forEach(item => {

    const status =
      normalizarStatus(item.status);

    if (
      status === "PENDING" ||
      status === "PENDENTE"
    ) {
      pendentes++;
    }

    else if (
      status === "AUTHORIZED" ||
      status === "AUTORIZADO"
    ) {
      autorizados++;
    }

    else if (
      status === "PROCESSING" ||
      status === "PROCESSANDO"
    ) {
      processando++;
    }

    else if (
      status === "COMPLETED" ||
      status === "CONCLUIDO"
    ) {
      concluidos++;
    }

    else if (
      status === "REJECTED" ||
      status === "REJEITADO"
    ) {
      rejeitados++;
    }

  });

  document.getElementById(
    "pendentes"
  ).textContent = pendentes;

  document.getElementById(
    "autorizados"
  ).textContent = autorizados;

  document.getElementById(
    "processando"
  ).textContent = processando;

  document.getElementById(
    "concluidos"
  ).textContent = concluidos;

  document.getElementById(
    "rejeitados"
  ).textContent = rejeitados;

}


function criarLinha(item) {

  const status =
    normalizarStatus(item.status);

  let acoes = `
    <span class="no-action">
      Sem ações
    </span>
  `;

  if (
    status === "PENDING" ||
    status === "PENDENTE"
  ) {

    acoes = `

      <button
        class="action-button authorize"
        onclick="autorizar('${escaparHTML(item.withdrawal_id)}')"
      >
        ✓ Autorizar
      </button>

      <button
        class="action-button reject"
        onclick="rejeitar('${escaparHTML(item.withdrawal_id)}')"
      >
        ✕ Rejeitar
      </button>

    `;

  }

  else if (
    status === "AUTHORIZED" ||
    status === "AUTORIZADO"
  ) {

    acoes = `

      <button
        class="action-button process"
        onclick="processar('${escaparHTML(item.withdrawal_id)}')"
      >
        ⚙️ Processar
      </button>

    `;

  }

  else if (
    status === "PROCESSING" ||
    status === "PROCESSANDO"
  ) {

    acoes = `

      <button
        class="action-button complete"
        onclick="concluir('${escaparHTML(item.withdrawal_id)}')"
      >
        ✅ Concluir
      </button>

    `;

  }

  return `

    <tr>

      <td>
        ${escaparHTML(
          item.withdrawal_id || item.id
        )}
      </td>

      <td>
        ${escaparHTML(
          item.user_id || "-"
        )}
      </td>

      <td>
        <strong>
          ${escaparHTML(
            item.amount ?? "-"
          )}
          ${escaparHTML(
            item.asset || "USDT"
          )}
        </strong>
      </td>

      <td class="address">
        ${escaparHTML(
          item.destination_address || "-"
        )}
      </td>

      <td>
        ${escaparHTML(
          item.network || "-"
        )}
      </td>

      <td>
        ${escaparHTML(
          formatarData(item.created_at)
        )}
      </td>

      <td>

        <span
          class="status ${statusClasse(status)}"
        >
          ${escaparHTML(
            statusTexto(status)
          )}
        </span>

      </td>

      <td class="hash">
        ${escaparHTML(
          item.tx_hash || "-"
        )}
      </td>

      <td>

        <div class="actions">
          ${acoes}
        </div>

      </td>

    </tr>

  `;

}


async function autorizar(withdrawalId) {

  if (
    !confirm(
      "Tem certeza que deseja autorizar este levantamento?"
    )
  ) {
    return;
  }

  try {

    const response = await fetch(
      "/api/admin-withdrawal-action",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        credentials: "include",

        body: JSON.stringify({
          withdrawal_id: withdrawalId,
          action: "AUTHORIZE"
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "Erro ao autorizar."
      );
    }

    alert(
      "Levantamento autorizado com sucesso."
    );

    await carregarLevantamentos();

  } catch (error) {

    alert(error.message);

  }

}


async function rejeitar(withdrawalId) {

  const motivo =
    prompt(
      "Informe o motivo da rejeição:"
    );

  if (
    !motivo ||
    motivo.trim().length < 3
  ) {

    alert(
      "Informe um motivo válido."
    );

    return;
  }

  try {

    const response = await fetch(
      "/api/admin-withdrawal-action",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        credentials: "include",

        body: JSON.stringify({
          withdrawal_id: withdrawalId,
          action: "REJECT",
          rejection_reason:
            motivo.trim()
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "Erro ao rejeitar."
      );
    }

    alert(
      "Levantamento rejeitado com sucesso."
    );

    await carregarLevantamentos();

  } catch (error) {

    alert(error.message);

  }

}


async function processar(withdrawalId) {

  if (
    !confirm(
      "Tem certeza que deseja colocar este levantamento em processamento?"
    )
  ) {
    return;
  }

  try {

    const response = await fetch(
      "/api/admin-withdrawal-process",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        credentials: "include",

        body: JSON.stringify({
          withdrawal_id: withdrawalId
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "Erro ao colocar em processamento."
      );
    }

    alert(
      "Levantamento colocado em processamento."
    );

    await carregarLevantamentos();

  } catch (error) {

    alert(error.message);

  }

}


async function concluir(withdrawalId) {

  const txHash =
    prompt(
      "Digite o TX Hash real da transação TRON:"
    );

  if (
    !txHash ||
    txHash.trim().length < 10
  ) {

    alert(
      "TX Hash inválido ou não informado."
    );

    return;
  }

  if (
    !confirm(
      "Confirma que esta transação foi realmente enviada e que o TX Hash está correto?"
    )
  ) {
    return;
  }

  try {

    const response = await fetch(
      "/api/admin-withdrawal-complete",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        credentials: "include",

        body: JSON.stringify({
          withdrawal_id: withdrawalId,
          tx_hash: txHash.trim()
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "Erro ao concluir levantamento."
      );
    }

    alert(
      "Levantamento concluído com sucesso."
    );

    await carregarLevantamentos();

  } catch (error) {

    alert(error.message);

  }

}


(async function iniciar() {

  const autenticado =
    await verificarSessao();

  if (!autenticado) {
    return;
  }

  await carregarLevantamentos();

})();

</script>

</body>
</html>
