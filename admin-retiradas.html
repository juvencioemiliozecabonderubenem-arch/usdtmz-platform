<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDTMZ Admin — Levantamentos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .back-button {
      border: none;
      background: #374151;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .back-button:hover {
      background: #4b5563;
    }

    main {
      padding: 25px;
      max-width: 1450px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card-title {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 28px;
      font-weight: bold;
    }

    .section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .refresh-button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .refresh-button:hover {
      background: #1d4ed8;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }

    th,
    td {
      padding: 13px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
      color: #374151;
      font-weight: 600;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-pendente {
      background: #fef3c7;
      color: #92400e;
    }

    .status-authorized {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-processing {
      background: #e0e7ff;
      color: #3730a3;
    }

    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .status-rejected,
    .status-failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .address {
      max-width: 220px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
    }

    .withdrawal-id {
      font-weight: bold;
      color: #111827;
    }

    .amount {
      font-weight: bold;
      white-space: nowrap;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-button {
      border: none;
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .authorize-button {
      background: #16a34a;
      color: white;
    }

    .authorize-button:hover {
      background: #15803d;
    }

    .reject-button {
      background: #dc2626;
      color: white;
    }

    .reject-button:hover {
      background: #b91c1c;
    }

    .action-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #6b7280;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      header h1 {
        font-size: 18px;
      }

      main {
        padding: 15px;
      }

      .section {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>USDTMZ Admin — Levantamentos</h1>

    <button
      class="back-button"
      onclick="window.location.href='/admin.html'"
    >
      ← Voltar
    </button>
  </header>

  <main>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <div class="cards">

      <div class="card">
        <div class="card-title">Pendentes</div>
        <div id="pendingCount" class="card-value">0</div>
      </div>

      <div class="card">
        <div class="card-title">Autorizados</div>
        <div id="authorizedCount" class="card-value">0</div>
      </div>

      <div class="card">
        <div class="card-title">Processando</div>
        <div id="processingCount" class="card-value">0</div>
      </div>

      <div class="card">
        <div class="card-title">Concluídos</div>
        <div id="completedCount" class="card-value">0</div>
      </div>

      <div class="card">
        <div class="card-title">Rejeitados</div>
        <div id="rejectedCount" class="card-value">0</div>
      </div>

    </div>

    <div class="section">

      <div class="section-header">
        <h2>Pedidos de levantamento</h2>

        <button
          class="refresh-button"
          onclick="loadWithdrawals()"
        >
          ↻ Atualizar
        </button>
      </div>

      <div class="table-container">

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Utilizador</th>
              <th>Valor</th>
              <th>Endereço TRON</th>
              <th>Rede</th>
              <th>Data</th>
              <th>Status</th>
              <th>TX Hash</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="withdrawalsBody">

            <tr>
              <td colspan="9" class="loading">
                A carregar levantamentos...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>

  <script>

    async function checkSession() {

      try {

        const response = await fetch("/api/admin-session", {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        });

        if (!response.ok) {
          window.location.href = "/admin-login.html";
          return false;
        }

        const data = await response.json();

        if (!data.success || !data.authenticated) {
          window.location.href = "/admin-login.html";
          return false;
        }

        return true;

      } catch (error) {

        window.location.href = "/admin-login.html";
        return false;

      }
    }


    function normalizeStatus(status) {

      if (!status) {
        return "";
      }

      return String(status)
        .trim()
        .toUpperCase();
    }


    function statusClass(status) {

      const normalized = normalizeStatus(status);

      switch (normalized) {

        case "PENDENTE":
        case "PENDING":
          return "status-pendente";

        case "AUTHORIZED":
        case "AUTORIZADO":
          return "status-authorized";

        case "PROCESSING":
        case "PROCESSANDO":
          return "status-processing";

        case "COMPLETED":
        case "CONCLUIDO":
        case "CONCLUÍDO":
          return "status-completed";

        case "REJECTED":
        case "REJEITADO":
        case "FAILED":
        case "FALHOU":
          return "status-rejected";

        default:
          return "status-pendente";
      }
    }


    function formatStatus(status) {

      const normalized = normalizeStatus(status);

      const names = {

        "PENDING": "Pendente",
        "PENDENTE": "Pendente",

        "AUTHORIZED": "Autorizado",
        "AUTORIZADO": "Autorizado",

        "PROCESSING": "Processando",
        "PROCESSANDO": "Processando",

        "COMPLETED": "Concluído",
        "CONCLUIDO": "Concluído",
        "CONCLUÍDO": "Concluído",

        "REJECTED": "Rejeitado",
        "REJEITADO": "Rejeitado",

        "FAILED": "Falhou",
        "FALHOU": "Falhou"
      };

      return names[normalized] || status || "Desconhecido";
    }


    function formatDate(dateValue) {

      if (!dateValue) {
        return "-";
      }

      try {

        const date = new Date(dateValue);

        if (isNaN(date.getTime())) {
          return dateValue;
        }

        return date.toLocaleString("pt-MZ", {
          dateStyle: "short",
          timeStyle: "short"
        });

      } catch {

        return dateValue;
      }
    }


    function formatAmount(amount) {

      if (
        amount === null ||
        amount === undefined ||
        amount === ""
      ) {
        return "0 USDT";
      }

      const number = Number(amount);

      if (isNaN(number)) {
        return `${amount} USDT`;
      }

      return `${number.toLocaleString("pt-MZ", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 8
      })} USDT`;
    }


    function updateCounters(withdrawals) {

      let pending = 0;
      let authorized = 0;
      let processing = 0;
      let completed = 0;
      let rejected = 0;

      withdrawals.forEach(withdrawal => {

        const status = normalizeStatus(withdrawal.status);

        if (
          status === "PENDING" ||
          status === "PENDENTE"
        ) {
          pending++;
        }

        else if (
          status === "AUTHORIZED" ||
          status === "AUTORIZADO"
        ) {
          authorized++;
        }

        else if (
          status === "PROCESSING" ||
          status === "PROCESSANDO"
        ) {
          processing++;
        }

        else if (
          status === "COMPLETED" ||
          status === "CONCLUIDO" ||
          status === "CONCLUÍDO"
        ) {
          completed++;
        }

        else if (
          status === "REJECTED" ||
          status === "REJEITADO" ||
          status === "FAILED" ||
          status === "FALHOU"
        ) {
          rejected++;
        }
      });

      document.getElementById("pendingCount").textContent = pending;
      document.getElementById("authorizedCount").textContent = authorized;
      document.getElementById("processingCount").textContent = processing;
      document.getElementById("completedCount").textContent = completed;
      document.getElementById("rejectedCount").textContent = rejected;
    }


    function renderWithdrawals(withdrawals) {

      const body = document.getElementById("withdrawalsBody");

      updateCounters(withdrawals);

      if (
        !withdrawals ||
        withdrawals.length === 0
      ) {

        body.innerHTML = `
          <tr>
            <td colspan="9" class="empty">
              Nenhum levantamento encontrado.
            </td>
          </tr>
        `;

        return;
      }


      body.innerHTML = withdrawals.map(withdrawal => {

        const withdrawalId =
          withdrawal.withdrawal_id ||
          withdrawal.id ||
          "-";

        const userId =
          withdrawal.user_id ||
          "Não associado";

        const amount =
          withdrawal.amount;

        const address =
          withdrawal.destination_address ||
          "-";

        const network =
          withdrawal.network ||
          "-";

        const date =
          formatDate(withdrawal.created_at);

        const status =
          withdrawal.status ||
          "PENDENTE";

        const txHash =
          withdrawal.tx_hash ||
          "-";

        const normalizedStatus =
          normalizeStatus(status);

        const isPending =
          normalizedStatus === "PENDING" ||
          normalizedStatus === "PENDENTE";


        return `
          <tr>

            <td>
              <div class="withdrawal-id">
                ${escapeHtml(withdrawalId)}
              </div>

              ${
                withdrawal.order_id
                  ? `<div class="small">
                      Ordem: ${escapeHtml(withdrawal.order_id)}
                     </div>`
                  : ""
              }
            </td>

            <td>
              ${escapeHtml(String(userId))}
            </td>

            <td>
              <span class="amount">
                ${escapeHtml(formatAmount(amount))}
              </span>
            </td>

            <td>
              <div class="address">
                ${escapeHtml(address)}
              </div>
            </td>

            <td>
              ${escapeHtml(network)}
            </td>

            <td>
              ${escapeHtml(date)}
            </td>

            <td>
              <span class="status ${statusClass(status)}">
                ${escapeHtml(formatStatus(status))}
              </span>
            </td>

            <td>
              <div class="address">
                ${escapeHtml(txHash)}
              </div>
            </td>

            <td>

              ${
                isPending
                  ? `
                    <div class="actions">

                      <button
                        class="action-button authorize-button"
                        onclick="authorizeWithdrawal('${escapeHtml(withdrawalId)}')"
                      >
                        ✓ Autorizar
                      </button>

                      <button
                        class="action-button reject-button"
                        onclick="rejectWithdrawal('${escapeHtml(withdrawalId)}')"
                      >
                        ✕ Rejeitar
                      </button>

                    </div>
                  `
                  : `
                    <span class="small">
                      Sem ações
                    </span>
                  `
              }

            </td>

          </tr>
        `;

      }).join("");
    }


    async function authorizeWithdrawal(withdrawalId) {

      const confirmed = confirm(
        `Tem certeza que deseja AUTORIZAR o levantamento ${withdrawalId}?`
      );

      if (!confirmed) {
        return;
      }

      await executeWithdrawalAction(
        withdrawalId,
        "AUTHORIZE"
      );
    }


    async function rejectWithdrawal(withdrawalId) {

      const reason = prompt(
        `Informe o motivo da rejeição do levantamento ${withdrawalId}:`
      );

      if (reason === null) {
        return;
      }

      if (reason.trim().length < 3) {

        alert(
          "O motivo da rejeição deve ter pelo menos 3 caracteres."
        );

        return;
      }

      await executeWithdrawalAction(
        withdrawalId,
        "REJECT",
        reason.trim()
      );
    }


    async function executeWithdrawalAction(
      withdrawalId,
      action,
      rejectionReason = null
    ) {

      const errorBox =
        document.getElementById("errorBox");

      const successBox =
        document.getElementById("successBox");

      errorBox.style.display = "none";
      successBox.style.display = "none";


      try {

        const body = {
          withdrawal_id: withdrawalId,
          action: action
        };

        if (
          action === "REJECT" &&
          rejectionReason
        ) {
          body.rejection_reason =
            rejectionReason;
        }


        const response = await fetch(
          "/api/admin-withdrawal-action",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify(body)
          }
        );


        if (response.status === 401) {

          window.location.href =
            "/admin-login.html";

          return;
        }


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Não foi possível executar a ação."
          );
        }


        successBox.textContent =
          data.message ||
          "Operação realizada com sucesso.";

        successBox.style.display = "block";


        await loadWithdrawals();


      } catch (error) {

        console.error(
          "Erro na ação do levantamento:",
          error
        );

        errorBox.textContent =
          error.message ||
          "Ocorreu um erro ao processar o levantamento.";

        errorBox.style.display = "block";
      }
    }


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    async function loadWithdrawals() {

      const body =
        document.getElementById(
          "withdrawalsBody"
        );

      const errorBox =
        document.getElementById(
          "errorBox"
        );

      const successBox =
        document.getElementById(
          "successBox"
        );

      errorBox.style.display = "none";
      errorBox.textContent = "";

      successBox.style.display = "none";
      successBox.textContent = "";


      body.innerHTML = `
        <tr>
          <td colspan="9" class="loading">
            A carregar levantamentos...
          </td>
        </tr>
      `;


      try {

        const response = await fetch(
          "/api/admin-withdrawals",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store"
          }
        );


        if (response.status === 401) {

          window.location.href =
            "/admin-login.html";

          return;
        }


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Não foi possível carregar os levantamentos."
          );
        }


        renderWithdrawals(
          Array.isArray(data.withdrawals)
            ? data.withdrawals
            : []
        );


      } catch (error) {

        console.error(
          "Erro ao carregar levantamentos:",
          error
        );

        body.innerHTML = `
          <tr>
            <td colspan="9" class="empty">
              Erro ao carregar os levantamentos.
            </td>
          </tr>
        `;

        errorBox.textContent =
          error.message ||
          "Ocorreu um erro ao consultar os levantamentos.";

        errorBox.style.display = "block";
      }
    }


    async function initialize() {

      const authenticated =
        await checkSession();

      if (!authenticated) {
        return;
      }

      await loadWithdrawals();
    }


    initialize();

  </script>

</body>
</html>
