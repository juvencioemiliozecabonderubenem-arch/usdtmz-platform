<!DOCTYPE html><html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>USDTMZ — Painel Admin</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout {
      border: 0;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      color: #111827;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin-bottom: 5px;
    }

    .welcome p {
      color: #6b7280;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .card span {
      display: block;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card strong {
      font-size: 28px;
    }

    .section {
      margin-top: 30px;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .section h3 {
      margin-top: 0;
    }

    .status {
      color: #059669;
      font-weight: bold;
    }

    .management-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .management-button:hover {
      opacity: 0.9;
    }

    #error {
      text-align: center;
      color: #dc2626;
      margin-top: 30px;
    }
  </style></head><body><header>
  <h1>USDTMZ Admin</h1>  <button class="logout" onclick="logout()">
    Sair
  </button>
</header><main>  <div class="welcome">
    <h2>Painel Administrativo</h2>
    <p>Bem-vindo ao centro de controle da USDTMZ.</p>
  </div>  <div class="cards"><div class="card">
  <span>Utilizadores</span>
  <strong>0</strong>
</div>

<div class="card">
  <span>Pedidos pendentes</span>
  <strong>0</strong>
</div>

<div class="card">
  <span>Transações</span>
  <strong>0</strong>
</div>

<div class="card">
  <span>Status</span>
  <strong class="status">Online</strong>
</div>

  </div>  <div class="section">
    <h3>Gestão</h3><button
  class="management-button"
  onclick="window.location.href='/admin-retiradas.html'"
>
  💰 Levantamentos
</button>

  </div>  <div class="section">
    <h3>Centro administrativo</h3><p>
  O painel está protegido e pronto para receber
  os módulos de utilizadores, pagamentos,
  saldos e levantamentos.
</p>

  </div>  <div id="error"></div></main><script>
async function checkSession() {
  try {

    const response = await fetch("/api/admin-session", {
      method: "GET",
      credentials: "include"
    });

    if (!response.ok) {
      window.location.href = "/admin-login.html";
      return;
    }

  } catch (error) {

    document.getElementById("error").textContent =
      "Não foi possível verificar a sessão.";

  }
}

function logout() {
  window.location.href = "/admin-login.html";
}

checkSession();
</script></body>
</html>
