<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>USDTMZ Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 21px;
    }

    .logout {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .wallet {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .wallet h2 {
      margin-bottom: 18px;
      font-size: 20px;
    }

    .wallet-address {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 7px;
      word-break: break-all;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .balances {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .balance {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
    }

    .balance-title {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .balance-value {
      font-size: 25px;
      font-weight: bold;
    }

    .refresh {
      margin-top: 18px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 11px 17px;
      border-radius: 7px;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #6b7280;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
    }

    .management-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .balances {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>USDTMZ Admin</h1>

  <button class="logout" onclick="logout()">
    Sair
  </button>
</header>

<div class="container">

  <!-- CARTEIRA -->
  <div class="wallet">

    <h2>💰 Carteira USDTMZ</h2>

    <div class="wallet-address">
      <strong>Endereço TRON:</strong><br>
      <span id="walletAddress">Carregando...</span>
    </div>

    <div class="balances">

      <div class="balance">
        <div class="balance-title">
          💵 Saldo USDT
        </div>

        <div class="balance-value">
          <span id="usdtBalance">...</span> USDT
        </div>
      </div>

      <div class="balance">
        <div class="balance-title">
          ⚡ Saldo TRX
        </div>

        <div class="balance-value">
          <span id="trxBalance">...</span> TRX
        </div>
      </div>

    </div>

    <button class="refresh" onclick="loadWalletBalance()">
      🔄 Atualizar saldo
    </button>

    <div class="status" id="walletStatus">
      Consultando carteira...
    </div>

  </div>

  <!-- ESTATÍSTICAS -->
  <div class="cards">

    <div class="card">
      <div class="card-title">
        Utilizadores
      </div>

      <div class="card-value">
        0
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        Pedidos pendentes
      </div>

      <div class="card-value">
        0
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        Transações
      </div>

      <div class="card-value">
        0
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        Status
      </div>

      <div class="card-value">
        Online
      </div>
    </div>

  </div>

  <!-- LEVANTAMENTOS -->

  <button
    class="management-button"
    onclick="window.location.href='/admin-retiradas.html'"
  >
    💰 Levantamentos
  </button>

</div>

<script>

  async function checkSession() {

    try {

      const response = await fetch(
        "/api/admin-session",
        {
          credentials: "include",
          cache: "no-store"
        }
      );

      if (!response.ok) {
        window.location.href = "/admin-login.html";
        return false;
      }

      const data = await response.json();

      if (!data.authenticated) {
        window.location.href = "/admin-login.html";
        return false;
      }

      return true;

    } catch (error) {

      window.location.href = "/admin-login.html";
      return false;
    }
  }


  async function loadWalletBalance() {

    const status =
      document.getElementById("walletStatus");

    const usdt =
      document.getElementById("usdtBalance");

    const trx =
      document.getElementById("trxBalance");

    const address =
      document.getElementById("walletAddress");

    status.textContent =
      "Consultando saldo...";

    try {

      const response = await fetch(
        "/api/tron-wallet-balance",
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );

      const data = await response.json();

      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "Erro ao consultar carteira."
        );
      }

      address.textContent =
        data.wallet_address;

      usdt.textContent =
        Number(data.balances.USDT || 0)
          .toFixed(6);

      trx.textContent =
        Number(data.balances.TRX || 0)
          .toFixed(6);

      status.textContent =
        "✓ Saldo atualizado com sucesso.";

    } catch (error) {

      usdt.textContent = "—";
      trx.textContent = "—";

      status.textContent =
        "Erro: " + error.message;
    }
  }


  function logout() {

    window.location.href =
      "/admin-login.html";
  }


  async function start() {

    const authenticated =
      await checkSession();

    if (!authenticated) {
      return;
    }

    await loadWalletBalance();
  }


  start();

</script>

</body>
</html>
