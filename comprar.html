<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprar USDT - USDTMZ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .rate {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .receive {
      background: #f3f4f6;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .receive strong {
      font-size: 22px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #111827;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Comprar USDT</h1>

      <div class="rate">
        Taxa atual: <strong>1 USDT = 65 MZN</strong>
      </div>

      <label for="amount">Valor em MZN</label>

      <input
        type="number"
        id="amount"
        min="10"
        step="0.01"
        placeholder="Ex.: 1000"
      >

      <div class="receive">
        Você receberá:
        <br>
        <strong id="usdtAmount">0 USDT</strong>
      </div>

      <label for="paymentMethod">
        Método de pagamento
      </label>

      <select id="paymentMethod">
        <option value="mpesa">M-Pesa</option>
        <option value="emola">e-Mola</option>
      </select>

      <button id="continueButton">
        Continuar
      </button>

      <div id="message" class="message"></div>

      <a href="/dashboard.html" class="back">
        ← Voltar para o painel
      </a>

    </div>
  </div>

  <script>
    const RATE = 65;

    const amountInput =
      document.getElementById("amount");

    const usdtAmount =
      document.getElementById("usdtAmount");

    const paymentMethod =
      document.getElementById("paymentMethod");

    const continueButton =
      document.getElementById("continueButton");

    const message =
      document.getElementById("message");

    amountInput.addEventListener(
      "input",
      function () {

        const mzn =
          Number(amountInput.value);

        if (
          !Number.isFinite(mzn) ||
          mzn <= 0
        ) {
          usdtAmount.textContent =
            "0 USDT";
          return;
        }

        const usdt =
          mzn / RATE;

        usdtAmount.textContent =
          usdt
            .toFixed(4)
            .replace(/\.?0+$/, "") +
          " USDT";
      }
    );

    function showMessage(
      text,
      type
    ) {
      message.textContent = text;
      message.className =
        "message " + type;
      message.style.display =
        "block";
    }

    continueButton.addEventListener(
      "click",
      async function () {

        message.style.display =
          "none";

        const mzn =
          Number(amountInput.value);

        if (
          !Number.isFinite(mzn) ||
          mzn < 10
        ) {
          showMessage(
            "O valor mínimo é 10 MZN.",
            "error"
          );
          return;
        }

        continueButton.disabled =
          true;

        continueButton.textContent =
          "A criar ordem...";

        try {

          const response =
            await fetch(
              "/api/criar-compra",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  amount_mzn: mzn,
                  payment_method:
                    paymentMethod.value
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
              "Não foi possível criar a compra."
            );
          }

          showMessage(
            "Ordem criada com sucesso! Referência: " +
            data.purchase.payment_reference,
            "success"
          );

          console.log(
            "Compra criada:",
            data.purchase
          );

        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Ocorreu um erro ao criar a compra.",
            "error"
          );

        } finally {

          continueButton.disabled =
            false;

          continueButton.textContent =
            "Continuar";
        }
      }
    );
  </script>

</body>
</html>
